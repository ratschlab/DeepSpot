name: deepspot

channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python==3.9
  - pip
  - pytorch::pytorch=2.4.1
  - pytorch::torchvision=0.19.1
  - pytorch::torchaudio=2.4.1
  - pytorch-cuda=12.4
  - numpy
  - pandas
  - scipy
  - anndata
  - scanpy
  - squidpy
  - matplotlib
  - pyvips
  - scikit-learn
  - lightning
  - openslide-python
  - python-igraph
  
  - pip:
      - plotnine
      - ipykernel
      - huggingface_hub
      - transformers
      - timm
      - scikit-misc
      - igraph>=0.10  # scanpy leiden(flavor="igraph") needs >=0.10; the conda solve with python==3.9 gives 0.9.9
